# Needs the Vertical Pod Autoscaler installed. updateMode "Off" only publishes recommendations.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: web-big-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-big
  updatePolicy:
    updateMode: "Off"
