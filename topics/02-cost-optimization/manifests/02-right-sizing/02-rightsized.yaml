# Same workload sized from measured usage: small request, memory limit with headroom, no CPU limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-big
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web-big
  template:
    metadata:
      labels:
        app: web-big
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
